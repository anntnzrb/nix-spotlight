name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - name: flake check
        run: nix flake check --allow-import-from-derivation

      - name: go build + vet + lint
        run: nix develop .# --command bash -c 'go build ./... && go vet ./... && golangci-lint run ./...'

      - name: go test
        if: runner.os == 'macOS'
        run: nix develop .# --command bash -c 'go test -race -count=1 -shuffle=on ./...'
